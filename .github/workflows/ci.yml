name: ci

# PR health gate: format, vet, lint, tests, build, dependency hygiene.
# Mirrors `task check` (the pre-commit hook) and the release workflow.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt -s (matches task check)
        run: |
          unformatted=$(gofmt -s -l .)
          if [ -n "$unformatted" ]; then
            echo "needs gofmt -s:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          # No config file yet — defaults (errcheck, govet, ineffassign,
          # staticcheck, unused) are a sensible floor. Add .golangci.yml
          # when we want to tune.

      # internal/tui tests need a tty on some runners; the full suite stays
      # available locally through `task test`.
      - name: go test (portable set)
        run: go test -race $(go list ./... | grep -v /internal/tui)

      - name: go mod tidy is a no-op
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum || { echo "run \`go mod tidy\` and commit"; exit 1; }

      - name: Cross-compile check (release targets)
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 \
              go build -trimpath -o /dev/null ./cmd/ghg || exit 1
          done

  native-sandbox:
    name: native sandbox (${{ matrix.backend }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            backend: seatbelt
          - os: ubuntu-latest
            backend: bubblewrap
    env:
      GHG_REQUIRE_SANDBOX_BACKEND: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: install bubblewrap
        if: matrix.backend == 'bubblewrap'
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap

      - name: enable unprivileged user namespaces
        if: matrix.backend == 'bubblewrap'
        run: |
          if [ -e /proc/sys/kernel/unprivileged_userns_clone ]; then
            echo 1 | sudo tee /proc/sys/kernel/unprivileged_userns_clone >/dev/null
          fi
          if [ -e /proc/sys/user/max_user_namespaces ]; then
            echo 28633 | sudo tee /proc/sys/user/max_user_namespaces >/dev/null
          fi

      - name: verify bubblewrap trust
        if: matrix.backend == 'bubblewrap'
        run: |
          bwrap=$(command -v bwrap)
          test -x "$bwrap"
          test "$(stat -c '%u' "$bwrap")" = 0
          for path in "$bwrap" "$(dirname "$bwrap")" /usr; do
            test "$(stat -c '%u' "$path")" = 0
            test -z "$(find "$path" -maxdepth 0 -perm /022 -print)"
          done

      - name: native sandbox contracts
        run: go test -count=1 ./internal/sandbox ./internal/tools
