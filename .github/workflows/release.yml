name: release

# Cut a release by pushing a tag:  git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      # internal/tui tests need a tty on some runners; the full suite stays
      # available locally through `task test`.
      - run: go test $(go list ./... | grep -v /internal/tui)

  # Each binary is built on a runner of its own platform. Each job
  # smoke-tests `--version` so a broken binary fails here instead of shipping.
  build:
    needs: test
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            asset: ghg-linux-x64
          - os: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            asset: ghg-linux-arm64
          - os: macos-14
            goos: darwin
            goarch: arm64
            asset: ghg-darwin-arm64
          # darwin-x64 is cross-built on ubuntu because macOS Intel hosted
          # runners are scarce. It is a pure-Go cross-compile; it cannot be
          # smoke-tested on linux.
          - os: ubuntu-latest
            goos: darwin
            goarch: amd64
            asset: ghg-darwin-x64
            smoke: false
    runs-on: ${{ matrix.os }}
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build ${{ matrix.asset }}
        run: |
          mkdir -p dist/release
          go build -trimpath \
            -ldflags "-s -w -X main.version=${{ github.ref_name }}" \
            -o "dist/release/${{ matrix.asset }}" ./cmd/ghg

      - name: Smoke test on a clean directory
        if: ${{ matrix.smoke != false }}
        run: |
          bin="$RUNNER_TEMP/${{ matrix.asset }}"
          cp "dist/release/${{ matrix.asset }}" "$bin"
          chmod +x "$bin"
          cd "$RUNNER_TEMP"
          "$bin" --version | grep -F "${{ github.ref_name }}"
          echo "OK: $bin runs and reports ${{ github.ref_name }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/release/${{ matrix.asset }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        run: |
          cd artifacts
          sha256sum ghg-* > SHA256SUMS
          cat SHA256SUMS
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            artifacts/ghg-* \
            artifacts/SHA256SUMS \
            install.sh \
            --title "${{ github.ref_name }}" \
            --generate-notes
